<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelAI Prompt Tool</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 18px;
      margin-top: 25px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    button:active {
      transform: scale(0.96);
    }

    #prompt {
      margin-top: 30px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      min-height: 50px;
      word-break: break-word;
    }

    #copyButton {
      margin-top: 15px;
      width: 100%;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <h1>NovelAI Prompt Tool</h1>

  <h2>表情</h2>

  <div class="buttons">
    <button onclick="addPrompt('smile')">笑顔</button>
    <button onclick="addPrompt('angry')">怒り</button>
    <button onclick="addPrompt('crying')">泣き顔</button>
    <button onclick="addPrompt('smirk')">にやり</button>
    <button onclick="addPrompt('wry smile')">苦笑い</button>
  </div>

  <h2>髪型</h2>

  <div class="buttons">
    <button onclick="addPrompt('ponytail')">ポニーテール</button>
    <button onclick="addPrompt('low ponytail')">ローポニーテール</button>
    <button onclick="addPrompt('twin tails')">ツインテール</button>
    <button onclick="addPrompt('hair down')">髪を下ろす</button>
  </div>

  <h2>服装</h2>

  <div class="buttons">
    <button onclick="addPrompt('school uniform')">制服</button>
    <button onclick="addPrompt('sailor uniform')">セーラー服</button>
    <button onclick="addPrompt('blazer')">ブレザー</button>
    <button onclick="addPrompt('gym uniform')">体操服</button>
  </div>

  <div id="prompt">
    ここに選択したプロンプトが表示されます
  </div>

  <button id="copyButton" onclick="copyPrompt()">
    プロンプトをコピー
  </button>

  <script>
    let prompts = [];

    function addPrompt(prompt) {
      prompts.push(prompt);
      updatePrompt();
    }

    function updatePrompt() {
      document.getElementById("prompt").textContent =
        prompts.join(", ");
    }

    function copyPrompt() {
      const text = prompts.join(", ");

      navigator.clipboard.writeText(text);

      alert("コピーしました！");
    }
  </script>

</body>
</html>
