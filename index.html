  <script>
    let prompts = [];
    let currentWeightIndex = -1;
    const WEIGHTS = [0.8, 1.0, 1.1, 1.2, 1.3, 1.5];

    const CONFLICT_PAIRS = [
      ['standing', 'sitting'],
      ['standing', 'lying'],
      ['standing', 'kneeling'],
      ['standing', 'crouching'],
      ['sitting', 'lying'],
      ['sitting', 'on all fours'],
      ['lying', 'standing'],
      ['lying', 'kneeling'],
      ['from behind', 'front view'],
      ['from behind', 'looking at viewer'],
      ['rear view', 'front view'],
      ['solo', '2girls'],
      ['solo', '1boy 1girl'],
      ['solo', 'multiple girls'],
      ['1girl', '2girls'],
      ['1girl', '3girls'],
      ['day', 'night'],
      ['morning', 'night'],
      ['indoors', 'outdoors']
    ];

    try {
      const saved = localStorage.getItem('novelai_prompts_v2');
      if (saved) prompts = JSON.parse(saved);
    } catch (e) {}

    function savePrompts() {
      try {
        localStorage.setItem('novelai_prompts_v2', JSON.stringify(prompts));
      } catch (e) {}
    }

    function addPrompt(text) {
      if (prompts.some(p => p.text === text)) return;
      prompts.push({ text: text, weight: 1.0 });
      updatePrompt();
      savePrompts();
    }

    function removePrompt(index) {
      prompts.splice(index, 1);
      updatePrompt();
      savePrompts();
    }

    function formatPrompt(p) {
      if (p.weight === 1.0) return p.text;
      return `(${p.text}:${p.weight})`;
    }

    function checkConflicts() {
      const texts = prompts.map(p => p.text.toLowerCase());
      const found = [];

      CONFLICT_PAIRS.forEach(([a, b]) => {
        const hasA = texts.some(t => t.includes(a.toLowerCase()));
        const hasB = texts.some(t => t.includes(b.toLowerCase()));
        if (hasA && hasB) {
          found.push(`${a} と ${b}`);
        }
      });

      const warning = document.getElementById('conflictWarning');
      if (found.length > 0) {
        warning.textContent = '⚠ 矛盾の可能性: ' + found.join(' / ');
        warning.classList.add('active');
      } else {
        warning.classList.remove('active');
        warning.textContent = '';
      }
    }

    function updatePrompt() {
      const promptElement = document.getElementById("prompt");
      const countElement = document.getElementById("promptCount");

      if (prompts.length === 0) {
        promptElement.innerHTML = '<span class="placeholder">ここに選択したプロンプトが表示されます</span>';
      } else {
        promptElement.innerHTML = prompts.map((p, i) => {
          const weightBadge = p.weight !== 1.0
            ? `<span class="weight">${p.weight}</span>`
            : '';
          return `<span class="prompt-chip" draggable="true" data-index="${i}" title="長押しで重み変更 / ドラッグで並び替え / ×で削除">
            ${escapeHtml(p.text)}${weightBadge}
            <span class="remove" data-remove="${i}">×</span>
          </span>`;
        }).join('');
      }

      countElement.textContent = prompts.length + ' 個選択中';
      checkConflicts();
      attachChipEvents();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function attachChipEvents() {
      const chips = document.querySelectorAll('.prompt-chip');
      let dragSrcIndex = null;
      let isDragging = false;

      chips.forEach(chip => {
        // ×ボタンでのみ削除
        const removeBtn = chip.querySelector('.remove');
        if (removeBtn) {
          removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const index = parseInt(removeBtn.dataset.remove, 10);
            removePrompt(index);
          });
          // ドラッグ開始を防ぐ
          removeBtn.addEventListener('mousedown', (e) => e.stopPropagation());
          removeBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
        }

        // 長押しで重み変更
        let pressTimer = null;
        let longPressed = false;

        const startPress = (e) => {
          // ×を押した場合は無視
          if (e.target.classList.contains('remove')) return;
          longPressed = false;
          isDragging = false;
          pressTimer = setTimeout(() => {
            if (!isDragging) {
              longPressed = true;
              const index = parseInt(chip.dataset.index, 10);
              openWeightPanel(index);
            }
          }, 500);
        };

        const cancelPress = () => {
          clearTimeout(pressTimer);
        };

        chip.addEventListener('mousedown', startPress);
        chip.addEventListener('mouseup', cancelPress);
        chip.addEventListener('mouseleave', cancelPress);
        chip.addEventListener('touchstart', startPress, { passive: true });
        chip.addEventListener('touchend', cancelPress);
        chip.addEventListener('touchcancel', cancelPress);

        // ドラッグ＆ドロップ
        chip.addEventListener('dragstart', (e) => {
          if (e.target.classList.contains('remove')) {
            e.preventDefault();
            return;
          }
          isDragging = true;
          dragSrcIndex = parseInt(chip.dataset.index, 10);
          chip.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          clearTimeout(pressTimer);
        });

        chip.addEventListener('dragend', () => {
          chip.classList.remove('dragging');
          chips.forEach(c => c.classList.remove('drag-over'));
          isDragging = false;
          dragSrcIndex = null;
        });

        chip.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          chip.classList.add('drag-over');
        });

        chip.addEventListener('dragleave', () => {
          chip.classList.remove('drag-over');
        });

        chip.addEventListener('drop', (e) => {
          e.preventDefault();
          chip.classList.remove('drag-over');
          const targetIndex = parseInt(chip.dataset.index, 10);
          if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
            const item = prompts.splice(dragSrcIndex, 1)[0];
            prompts.splice(targetIndex, 0, item);
            updatePrompt();
            savePrompts();
          }
          dragSrcIndex = null;
          isDragging = false;
        });
      });
    }

    function openWeightPanel(index) {
      currentWeightIndex = index;
      const current = prompts[index].weight;
      const container = document.getElementById('weightButtons');
      container.innerHTML = WEIGHTS.map(w => {
        const active = w === current ? 'active' : '';
        return `<button class="${active}" onclick="setWeight(${w})">${w}</button>`;
      }).join('');
      document.getElementById('weightOverlay').classList.add('active');
    }

    function setWeight(w) {
      if (currentWeightIndex >= 0) {
        prompts[currentWeightIndex].weight = w;
        updatePrompt();
        savePrompts();
      }
      closeWeightPanel();
    }

    function closeWeightPanel() {
      document.getElementById('weightOverlay').classList.remove('active');
      currentWeightIndex = -1;
    }

    function copyPrompt() {
      const text = prompts.map(formatPrompt).join(', ');
      if (!text) {
        alert('プロンプトがありません');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert('コピーしました！');
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('コピーしました！');
      });
    }

    function clearPrompt() {
      if (prompts.length === 0) return;
      if (confirm('すべて消去しますか？')) {
        prompts = [];
        updatePrompt();
        savePrompts();
      }
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      window.scrollTo(0, 0);
    }

    updatePrompt();
  </script>

</body>
</html>
