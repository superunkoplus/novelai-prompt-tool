function updatePrompt(){const el=document.getElementById("prompt"),c=document.getElementById("promptCount"),exp=document.getElementById("promptExpand");if(!prompts.length){el.innerHTML='<span class="placeholder">ここに選択したプロンプトが表示されます</span>';el.classList.remove("expanded");exp.classList.remove("show");promptExpanded=false}else{el.innerHTML=prompts.map((p,i)=>{const b=p.weight!==1.0?`<span class="weight">${p.weight}</span>`:"";return `<span class="prompt-chip" data-index="${i}"><button class="move-btn" onclick="event.stopPropagation();movePrompt(${i},-1)">↑</button><button class="move-btn" onclick="event.stopPropagation();movePrompt(${i},1)">↓</button>${escapeHtml(p.text)}${b}<span class="remove" onclick="event.stopPropagation();removePrompt(${i})">×</span></span>`}).join("");if(prompts.length>COLLAPSE_THRESHOLD){exp.classList.add("show");if(!promptExpanded)el.classList.remove("expanded");else el.classList.add("expanded");exp.textContent=promptExpanded?"▲ 閉じる":"… タップで展開（"+prompts.length+"個）"}else{exp.classList.remove("show");el.classList.add("expanded");promptExpanded=true}}c.textContent=prompts.length+" 個選択中";checkConflicts();attachChipEvents();updateSelectedButtons()}
function escapeHtml(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}
function openVariation(k){const d=VARIATIONS[k];if(!d)return;document.getElementById("variationTitle").textContent=d.title;document.getElementById("variationList").innerHTML=d.options.map(o=>`<button onclick="selectVariation(\`${o.prompt.replace(/`/g,"\\`")}\`)">${o.label}${o.desc?`<span class="desc">${o.desc}</span>`:""}</button>`).join("");document.getElementById("variationOverlay").classList.add("active")}
function selectVariation(t){addPrompt(t);closeVariationPanel()}
function closeVariationPanel(){document.getElementById("variationOverlay").classList.remove("active");pendingClothing=null}
function openClothingColor(type){pendingClothing={type,color:null};const colors=CLOTHING_COLORS[type]||[];document.getElementById("variationTitle").textContent="色を選択";document.getElementById("variationList").innerHTML=colors.map(c=>`<button onclick="selectClothingColor('${c.value}')">${c.label}</button>`).join("");document.getElementById("variationOverlay").classList.add("active")}
function selectClothingColor(colorValue){pendingClothing.color=colorValue;const states=CLOTHING_STATES[pendingClothing.type]||[];document.getElementById("variationTitle").textContent="状態を選択";document.getElementById("variationList").innerHTML=states.map(s=>{const base=CLOTHING_BASE[pendingClothing.type];const colorPart=pendingClothing.color?pendingClothing.color+" ":"";let prompt="";if(pendingClothing.type==="nurse_maid"){const isMaid=pendingClothing.color==="black";prompt=(isMaid?"black maid outfit":(pendingClothing.color?pendingClothing.color+" nurse outfit":"nurse outfit"))+s.suffix}else if(pendingClothing.type==="office"){prompt=(pendingClothing.color?pendingClothing.color+" ":"")+"office lady, suit"+s.suffix}else if(pendingClothing.type==="uniform"){prompt=(pendingClothing.color?pendingClothing.color+" ":"")+"school uniform"+s.suffix}else{prompt=colorPart+base+s.suffix}return `<button onclick="selectVariation(\`${prompt.replace(/`/g,"\\`")}\`)">${s.label}</button>`}).join("")}
function buildSearchIndex(){SEARCH_INDEX.length=0;document.querySelectorAll("button[onclick*='addPrompt']").forEach(btn=>{const label=btn.textContent.trim();const m=btn.getAttribute("onclick").match(/addPrompt\('([^']+)'\)|addPrompt\("([^"]+)"\)|addPrompt\(&quot;([^&]+)&quot;\)/);const text=m?(m[1]||m[2]||m[3]):null;if(label&&text)SEARCH_INDEX.push({label,text,type:"direct"})});Object.keys(VARIATIONS).forEach(k=>{const v=VARIATIONS[k];SEARCH_INDEX.push({label:v.title,text:null,type:"variation",key:k});(v.options||[]).forEach(o=>{SEARCH_INDEX.push({label:o.label+"（"+v.title+"）",text:o.prompt,type:"direct"})})});["lingerie","bikini","school_swimsuit","uniform","nurse_maid","office"].forEach(k=>{SEARCH_INDEX.push({label:({lingerie:"ランジェリー",bikini:"ビキニ系",school_swimsuit:"スクール水着",uniform:"制服",nurse_maid:"ナース・メイド",office:"OL・スーツ"})[k],text:null,type:"clothing",key:k})})}
function runSearch(q){const box=document.getElementById("searchResults");q=(q||"").trim().toLowerCase();if(!q){box.innerHTML="";return}const hits=SEARCH_INDEX.filter(i=>i.label.toLowerCase().includes(q)||(i.text&&i.text.toLowerCase().includes(q))).slice(0,30);if(!hits.length){box.innerHTML='<div class="empty">該当なし</div>';return}box.innerHTML=hits.map(h=>{if(h.type==="direct")return `<button onclick="addPrompt(\`${h.text.replace(/`/g,"\\`")}\`);document.getElementById('searchBox').value='';runSearch('')">${escapeHtml(h.label)}</button>`;if(h.type==="variation")return `<button onclick="openVariation('${h.key}')">${escapeHtml(h.label)} →</button>`;if(h.type==="clothing")return `<button onclick="openClothingColor('${h.key}')">${escapeHtml(h.label)} →</button>`;return""}).join("")}
function attachChipEvents(){document.querySelectorAll(".prompt-chip").forEach(chip=>{let timer=null;const start=e=>{if(e.target.classList.contains("remove")||e.target.classList.contains("move-btn"))return;timer=setTimeout(()=>openWeightPanel(+chip.dataset.index),500)};const cancel=()=>clearTimeout(timer);chip.addEventListener("touchstart",start,{passive:true});chip.addEventListener("touchend",cancel);chip.addEventListener("touchcancel",cancel);chip.addEventListener("mousedown",start);chip.addEventListener("mouseup",cancel);chip.addEventListener("mouseleave",cancel)})}
function openWeightPanel(i){currentWeightIndex=i;const cur=prompts[i].weight;document.getElementById("weightButtons").innerHTML=WEIGHTS.map(w=>`<button class="${w===cur?"active":""}" onclick="setWeight(${w})">${w}</button>`).join("");document.getElementById("weightOverlay").classList.add("active")}
function setWeight(w){if(currentWeightIndex>=0){prompts[currentWeightIndex].weight=w;updatePrompt();savePrompts()}closeWeightPanel()}
function closeWeightPanel(){document.getElementById("weightOverlay").classList.remove("active");currentWeightIndex=-1}
function copyPrompt(){const t=prompts.map(formatPrompt).join(", ");if(!t)return alert("プロンプトがありません");navigator.clipboard.writeText(t).then(()=>alert("コピーしました！")).catch(()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);alert("コピーしました！")})}
function clearPrompt(){if(!prompts.length)return;if(confirm("すべて消去しますか？")){prompts=[];updatePrompt();savePrompts()}}
function showPage(id){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0);updateSelectedButtons()}
updatePrompt();buildSearchIndex();
</script>
</body>
</html>
