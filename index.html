<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelAI Prompt Tool</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 18px;
      margin-top: 25px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    button:active {
      transform: scale(0.96);
    }

    .menuButton {
      width: 100%;
      margin-bottom: 12px;
      padding: 16px;
      font-size: 17px;
      text-align: left;
    }

    #promptArea {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #f5f5f5;
      padding-bottom: 10px;
    }

    #prompt {
      margin-top: 0;
      padding: 15px;
      background: white;
      border-radius: 10px;
      min-height: 50px;
      word-break: break-word;
    }

    #copyButton,
    #clearButton {
      margin-top: 15px;
      width: 100%;
    }

    #copyButton {
      background: #222;
      color: white;
    }

    #clearButton {
      background: white;
      color: red;
      border: 1px solid red;
    }

    .backButton {
      margin-bottom: 20px;
      background: white;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }
  </style>
</head>

      <button onclick="addPrompt('arimura mao')">有村麻央</button>
      <button onclick="addPrompt('himesaki rinami')">姫崎莉波</button>
      <button onclick="addPrompt('amaya tsubame')">雨夜燕</button>
      <button onclick="addPrompt('neo asari')">根緒亜紗里</button>

    </div>

  </div>


  <script>

    let prompts = [];

    function addPrompt(prompt) {
      prompts.push(prompt);
      updatePrompt();
    }

    function updatePrompt() {
      const promptElement = document.getElementById("prompt");

      if (prompts.length === 0) {
        promptElement.textContent =
          "ここに選択したプロンプトが表示されます";
      } else {
        promptElement.textContent =
          prompts.join(", ");
      }
    }

    function copyPrompt() {
      const text = prompts.join(", ");

      navigator.clipboard.writeText(text);

      alert("コピーしました！");
    }

    function clearPrompt() {
      prompts = [];
      updatePrompt();
    }

    function showPage(pageId) {

      const pages = document.querySelectorAll(".page");

      pages.forEach(function(page) {
        page.classList.remove("active");
      });

      document.getElementById(pageId).classList.add("active");

      window.scrollTo(0, 0);
    }

  </script>

</body>
</html>
