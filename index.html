  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f0f2f5;
      color: #222;
      line-height: 1.5;
    }

    h1 { font-size: 22px; margin: 0 0 20px; font-weight: 700; }
    h2 { font-size: 16px; margin: 24px 0 12px; color: #444; border-left: 4px solid #4a90d9; padding-left: 10px; }
    h3 { font-size: 15px; margin: 20px 0 10px; color: #555; }

    .buttons { display: flex; flex-wrap: wrap; gap: 8px; }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 15px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      color: #222;
    }
    button:active { transform: scale(0.96); }
    button:hover { background: #f8f9fa; }

    .menuButton {
      width: 100%;
      margin-bottom: 10px;
      padding: 15px 18px;
      font-size: 16px;
      text-align: left;
      font-weight: 500;
    }

    #promptArea {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #f0f2f5;
      margin: -16px -16px 16px;
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
    }

    #prompt {
      margin: 0;
      padding: 14px;
      background: #fff;
      border-radius: 12px;
      min-height: 56px;
      word-break: break-word;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
    }

    #prompt .placeholder { color: #999; font-size: 14px; padding: 4px 0; }

    .prompt-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 20px;
      padding: 6px 10px 6px 14px;
      font-size: 13px;
      max-width: 100%;
      word-break: break-all;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .prompt-chip:active { cursor: grabbing; }
    .prompt-chip:hover { background: #d2e3fc; }
    .prompt-chip.dragging { opacity: 0.5; }
    .prompt-chip.drag-over { outline: 2px dashed #1a73e8; }
    .prompt-chip .weight {
      font-size: 11px;
      background: #1a73e8;
      color: #fff;
      border-radius: 10px;
      padding: 1px 6px;
    }
    .prompt-chip .remove {
      font-size: 16px;
      line-height: 1;
      opacity: 0.7;
      font-weight: bold;
      padding: 2px 4px;
      cursor: pointer;
      border-radius: 50%;
    }
    .prompt-chip .remove:hover { background: rgba(0,0,0,0.1); opacity: 1; }

    #conflictWarning {
      display: none;
      margin-top: 8px;
      padding: 8px 12px;
      background: #fce8e6;
      color: #c5221f;
      border-radius: 8px;
      font-size: 13px;
    }
    #conflictWarning.active { display: block; }

    .prompt-actions { display: flex; gap: 10px; margin-top: 12px; }

    #copyButton, #clearButton {
      flex: 1;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
    }
    #copyButton { background: #1a73e8; color: white; }
    #copyButton:hover { background: #1557b0; }
    #clearButton { background: #fff; color: #d93025; border: 1px solid #fad2cf; }
    #clearButton:hover { background: #fce8e6; }

    .backButton { margin-bottom: 16px; background: #fff; padding: 10px 16px; font-size: 14px; }

    .page { display: none; }
    .page.active { display: block; }

    .count { font-size: 13px; color: #666; margin-top: 6px; text-align: right; }

    #weightOverlay, #variationOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #weightOverlay.active, #variationOverlay.active { display: flex; }

    #weightPanel, #variationPanel {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      text-align: center;
    }
    #weightPanel h3, #variationPanel h3 { margin: 0 0 16px; font-size: 17px; }
    #weightPanel .weight-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    #weightPanel .weight-btns button {
      min-width: 56px;
      padding: 12px 10px;
      font-size: 15px;
      font-weight: 600;
    }
    #weightPanel .weight-btns button.active { background: #1a73e8; color: #fff; }
    #weightPanel .cancel, #variationPanel .cancel {
      margin-top: 16px;
      width: 100%;
      background: #f1f3f4;
    }

    #variationPanel .var-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #variationPanel .var-list button {
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      font-size: 15px;
      background: #f8f9fa;
      border: 1px solid #e8eaed;
    }
    #variationPanel .var-list button:hover {
      background: #e8f0fe;
      border-color: #1a73e8;
    }
    #variationPanel .var-list button .desc {
      display: block;
      font-size: 12px;
      color: #666;
      margin-top: 3px;
    }
  </style>
</head>

      if (saved) prompts = JSON.parse(saved);
    } catch (e) {}

    function savePrompts() {
      try { localStorage.setItem('novelai_prompts_v2', JSON.stringify(prompts)); } catch (e) {}
    }

    function addPrompt(text) {
      if (prompts.some(p => p.text === text)) return;
      prompts.push({ text, weight: 1.0 });
      updatePrompt();
      savePrompts();
    }

    function removePrompt(index) {
      prompts.splice(index, 1);
      updatePrompt();
      savePrompts();
    }

    function formatPrompt(p) {
      return p.weight === 1.0 ? p.text : `(${p.text}:${p.weight})`;
    }

    function checkConflicts() {
      const texts = prompts.map(p => p.text.toLowerCase());
      const found = [];
      CONFLICT_PAIRS.forEach(([a, b]) => {
        if (texts.some(t => t.includes(a.toLowerCase())) && texts.some(t => t.includes(b.toLowerCase()))) {
          found.push(`${a} と ${b}`);
        }
      });
      const warning = document.getElementById('conflictWarning');
      if (found.length) {
        warning.textContent = '⚠ 矛盾の可能性: ' + found.join(' / ');
        warning.classList.add('active');
      } else {
        warning.classList.remove('active');
        warning.textContent = '';
      }
    }

    function updatePrompt() {
      const el = document.getElementById('prompt');
      const countEl = document.getElementById('promptCount');
      if (!prompts.length) {
        el.innerHTML = '<span class="placeholder">ここに選択したプロンプトが表示されます</span>';
      } else {
        el.innerHTML = prompts.map((p, i) => {
          const badge = p.weight !== 1.0 ? `<span class="weight">${p.weight}</span>` : '';
          return `<span class="prompt-chip" draggable="true" data-index="${i}" title="長押しで重み変更 / ドラッグで並び替え / ×で削除">
            ${escapeHtml(p.text)}${badge}<span class="remove" data-remove="${i}">×</span></span>`;
        }).join('');
      }
      countEl.textContent = prompts.length + ' 個選択中';
      checkConflicts();
      attachChipEvents();
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

      document.getElementById('variationTitle').textContent = data.title;
      document.getElementById('variationList').innerHTML = data.options.map(opt => `

          ${opt.label}<span class="desc">${opt.desc}</span>
        </button>`).join('');
      document.getElementById('variationOverlay').classList.add('active');

    function closeVariationPanel() {

    function attachChipEvents() {
      const chips = document.querySelectorAll('.prompt-chip');
      let dragSrc = null, isDragging = false;

      chips.forEach(chip => {
        const rm = chip.querySelector('.remove');
        if (rm) {
          rm.addEventListener('click', e => {
            e.stopPropagation();
            e.preventDefault();
            removePrompt(+rm.dataset.remove);
          });
          rm.addEventListener('mousedown', e => e.stopPropagation());
          rm.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
        }

        let timer = null;
        const start = e => {
          if (e.target.classList.contains('remove')) return;
          isDragging = false;
          timer = setTimeout(() => {
            if (!isDragging) openWeightPanel(+chip.dataset.index);
          }, 500);
        };
        const cancel = () => clearTimeout(timer);

        chip.addEventListener('mousedown', start);
        chip.addEventListener('mouseup', cancel);
        chip.addEventListener('mouseleave', cancel);
        chip.addEventListener('touchstart', start, { passive: true });
        chip.addEventListener('touchend', cancel);
        chip.addEventListener('touchcancel', cancel);

        chip.addEventListener('dragstart', e => {
          if (e.target.classList.contains('remove')) { e.preventDefault(); return; }
          isDragging = true;
          dragSrc = +chip.dataset.index;
          chip.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          clearTimeout(timer);
        });
        chip.addEventListener('dragend', () => {
          chip.classList.remove('dragging');
          chips.forEach(c => c.classList.remove('drag-over'));
          isDragging = false;
          dragSrc = null;
        });
        chip.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          chip.classList.add('drag-over');
        });
        chip.addEventListener('dragleave', () => chip.classList.remove('drag-over'));
        chip.addEventListener('drop', e => {
          e.preventDefault();
          chip.classList.remove('drag-over');
          const target = +chip.dataset.index;
          if (dragSrc !== null && dragSrc !== target) {
            const item = prompts.splice(dragSrc, 1)[0];
            prompts.splice(target, 0, item);
            updatePrompt();
            savePrompts();
          }
          dragSrc = null;
          isDragging = false;
        });
      });
    }

    function openWeightPanel(index) {
      currentWeightIndex = index;
      const cur = prompts[index].weight;
      document.getElementById('weightButtons').innerHTML = WEIGHTS.map(w =>
        `<button class="${w === cur ? 'active' : ''}" onclick="setWeight(${w})">${w}</button>`

    function setWeight(w) {
      if (currentWeightIndex >= 0) {
        prompts[currentWeightIndex].weight = w;
        updatePrompt();
        savePrompts();
      }

    }

    function closeWeightPanel() {
      document.getElementById('weightOverlay').classList.remove('active');
      currentWeightIndex = -1;
    }

    function copyPrompt() {
      const text = prompts.map(formatPrompt).join(', ');
      if (!text) return alert('プロンプトがありません');
      navigator.clipboard.writeText(text).then(() => alert('コピーしました！')).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('コピーしました！');
      });
    }

    function clearPrompt() {
      if (!prompts.length) return;
      if (confirm('すべて消去しますか？')) {
        prompts = [];
        updatePrompt();
        savePrompts();
      }
    }
