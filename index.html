<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NovelAI Prompt Tool</title>
<style>
:root{
  --bg:#f4f5f7;--text:#1a1a1a;--card:#ffffff;--border:#e8eaed;
  --accent:#2563eb;--accent-soft:#eff6ff;
  --var-bg:#fef9c3;--var-border:#fde68a;
  --hint-bg:#d1fae5;--hint-border:#6ee7b7;
  --danger:#dc2626;--danger-soft:#fef2f2;
  --muted:#6b7280;--shadow:0 1px 3px rgba(0,0,0,.06);
  --radius:14px;--radius-sm:10px;
}
body.dark{
  --bg:#1c1c1e;--text:#f5f5f7;--card:#2c2c2e;--border:#3a3a3c;
  --accent:#64b5f6;--accent-soft:#1e3a5f;
  --var-bg:#3d3420;--var-border:#6b5a2e;
  --hint-bg:#0d4a3a;--hint-border:#2e8b6e;
  --danger:#ef9a9a;--danger-soft:#4a2020;
  --muted:#a1a1a6;--shadow:0 1px 4px rgba(0,0,0,.4);

*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",Meiryo,sans-serif;margin:0;padding:16px;padding-bottom:88px;background:var(--bg);color:var(--text);line-height:1.55}
h1{font-size:22px;margin:0 0 18px;font-weight:700}
h2{font-size:13px;margin:28px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:15px;margin:18px 0 10px;color:var(--muted);font-weight:600}
.buttons{display:flex;flex-wrap:wrap;gap:8px}
button{border:none;border-radius:var(--radius-sm);padding:11px 15px;font-size:14px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;color:var(--text);-webkit-touch-callout:none;user-select:none;transition:transform .1s,opacity .12s}
button:active{transform:scale(.96);opacity:.9}
button.var-btn{background:var(--var-bg);border:1px solid var(--var-border)}
button[data-title],button[data-body]{background:var(--hint-bg);border:1px solid var(--hint-border)}
button.selected{opacity:.4;pointer-events:none;text-decoration:line-through}
button.conflict-btn{background:var(--danger-soft)!important;color:var(--danger)!important;border:1px solid var(--danger)!important;opacity:1;pointer-events:auto;text-decoration:none}
.menuButton{width:100%;margin-bottom:8px;padding:16px 18px;font-size:15px;text-align:left;font-weight:500;border-radius:var(--radius)}
#promptArea{position:sticky;top:0;z-index:1000;background:var(--bg);margin:-16px -16px 16px;padding:14px 16px 12px;border-bottom:1px solid var(--border)}
#prompt{margin:0;padding:12px 14px;background:var(--card);border-radius:var(--radius);min-height:52px;word-break:break-word;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;max-height:110px;overflow:hidden;transition:max-height .25s}
#prompt.expanded{max-height:none;overflow:visible}
#prompt .placeholder{color:var(--muted);font-size:13px;padding:4px 0}
#promptExpand{display:none;width:100%;text-align:center;padding:8px;margin-top:6px;font-size:12px;color:var(--accent);background:var(--card);border-radius:8px;border:1px dashed var(--border);cursor:pointer}
#promptExpand.show{display:block}
.prompt-chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:5px 8px 5px 11px;font-size:12px;max-width:100%;word-break:break-all;user-select:none;cursor:pointer;font-weight:500}
.prompt-chip .weight{font-size:10px;background:var(--accent);color:#fff;border-radius:8px;padding:1px 5px;font-weight:600}
.prompt-chip .remove{font-size:14px;line-height:1;opacity:.65;font-weight:700;padding:2px 4px;cursor:pointer;border-radius:50%}
.prompt-actions{display:flex;gap:8px;margin-top:10px;align-items:center;position:relative}
#copyMsg{display:none;position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:12px;color:var(--accent);padding:4px;margin-bottom:4px;font-weight:600}
#copyMsg.show{display:block}
#copyButton,#clearButton{flex:1;padding:13px;font-size:14px;font-weight:600;border-radius:var(--radius-sm)}
#copyButton{background:var(--accent);color:#fff}
#copyButton.copied{background:#16a34a}
#clearButton{background:var(--card);color:var(--danger);border:1px solid #fecaca}
.backButton{margin-bottom:14px;background:var(--card);padding:10px 14px;font-size:13px;border-radius:var(--radius-sm)}
.page{display:none}.page.active{display:block}
.count{font-size:12px;color:var(--muted);margin-top:6px;text-align:right}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center;padding:16px}
.overlay.active{display:flex}
#reorderOverlay{align-items:flex-end;padding:0}
#reorderOverlay .panel{border-radius:20px 20px 0 0;max-width:100%;width:100%;margin:0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto;text-align:center;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.panel h3{margin:0 0 14px;font-size:16px;font-weight:700}
.panel .list{display:flex;flex-direction:column;gap:8px}
.panel .list button{width:100%;text-align:left;padding:13px 15px;font-size:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm)}
.panel .list button .desc{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:400}
.panel .cancel{margin-top:14px;width:100%;background:var(--bg);border-radius:var(--radius-sm)}
.panel .row{display:flex;gap:8px;margin-top:12px}
.panel .row button{flex:1;border-radius:var(--radius-sm)}
.panel .yes{background:var(--accent);color:#fff}
.panel .no{background:var(--bg)}
#weightButtons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#weightButtons button{min-width:52px;padding:12px 10px;font-size:14px;font-weight:600}
#weightButtons button.active{background:var(--accent);color:#fff}
#descOverlay .panel{text-align:left;max-width:340px}
#descOverlay .desc-title{font-size:17px;font-weight:700;margin:0 0 10px;text-align:center}
#descOverlay .desc-body{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:10px;white-space:pre-line}
#descOverlay .desc-note{font-size:12px;line-height:1.6;color:var(--muted);background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:4px}
#descOverlay .desc-note strong{display:block;color:var(--danger);margin-bottom:4px;font-size:12px}
#homeFab{position:fixed;bottom:20px;right:16px;z-index:1500;width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;box-shadow:0 4px 16px rgba(37,99,235,.35);display:flex;align-items:center;justify-content:center;padding:0;border:none}
#homeFab:active{transform:scale(.92)}
#reorderOverlay .reorder-label{font-size:14px;font-weight:600;margin-bottom:6px;word-break:break-all}
#reorderOverlay .reorder-pos{font-size:12px;color:var(--muted);margin-bottom:14px}
#reorderOverlay .reorder-btns{display:flex;flex-direction:column;gap:8px}
#reorderOverlay .reorder-btns button{width:100%;padding:15px;font-size:16px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:var(--radius-sm)}
#reorderOverlay .reorder-btns button:disabled{opacity:.3}

.tool-section{margin:16px 0;padding:16px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border)}
.tool-section h3{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--text);text-transform:none}
.tool-hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.random-options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.random-options button{flex:1;min-width:90px;padding:11px 8px;font-size:13px;font-weight:500;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg)}
.random-options button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.random-run{width:100%;padding:14px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border-radius:var(--radius-sm);margin-top:4px}
.candidate-list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.candidate-card{text-align:left;padding:14px 16px;font-size:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);width:100%}
.candidate-card .pack-title{font-weight:600;font-size:14px;margin-bottom:4px;color:var(--text)}
.candidate-card .pack-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.candidate-card .pack-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.candidate-card .pack-tag{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-weight:500}
.candidate-card .pack-actions{display:flex;gap:8px}
.candidate-card .pack-actions button{flex:1;padding:10px;font-size:13px;font-weight:600}
.batch-controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.batch-controls label{font-size:13px;color:var(--muted)}
.batch-controls select,.batch-controls input[type="number"]{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px}
.batch-list{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-height:400px;overflow-y:auto}
.batch-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;text-align:left}
.batch-item .batch-num{font-size:11px;color:var(--muted);margin-bottom:4px}
.batch-item .batch-text{font-size:12px;line-height:1.5;word-break:break-all;max-height:60px;overflow:hidden}
.batch-item .batch-actions{display:flex;gap:6px;margin-top:8px}
.batch-item .batch-actions button{flex:1;padding:9px;font-size:12px;font-weight:600}
.history-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:300px;overflow-y:auto}
.history-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:left;font-size:12px}
.history-item .hist-date{font-size:11px;color:var(--muted);margin-bottom:4px}
.history-item .hist-text{word-break:break-all;max-height:48px;overflow:hidden;line-height:1.4}
.history-item .hist-actions{display:flex;gap:6px;margin-top:8px}
.history-item .hist-actions button{flex:1;padding:8px;font-size:12px}
.template-row{display:flex;gap:8px;margin-bottom:10px}
.template-row input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px}
.template-row button{padding:10px 14px;font-weight:600}
.conflict-warning{background:var(--danger-soft);color:var(--danger);border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0 0;font-size:12px;display:none;line-height:1.5}
.conflict-warning.show{display:block}
</style>
</head>
<body>
<div id="promptArea">
  <div id="prompt"><span class="placeholder">ここに選択したプロンプトが表示されます</span></div>
  <div id="promptExpand" onclick="togglePromptExpand()">… タップで展開</div>
  <div class="count" id="promptCount">0 個選択中</div>
  <div class="prompt-actions">
    <div id="copyMsg">コピーしました！</div>
    <button id="copyButton" onclick="copyPrompt()">プロンプトをコピー</button>
    <button id="clearButton" onclick="clearPrompt()">すべて消去</button>
  </div>
</div>

<button id="homeFab" onclick="showPage('homePage')" title="ホーム">🏠</button>

<div id="chipMenuOverlay" class="overlay"><div class="panel"><h3 id="chipMenuTitle">操作</h3><div class="list" id="chipMenuList"></div><button class="cancel" onclick="closeChipMenu()">キャンセル</button></div></div>
<div id="reorderOverlay" class="overlay"><div class="panel"><h3>順番を変える</h3><div class="reorder-label" id="reorderLabel"></div><div class="reorder-pos" id="reorderPos"></div><div class="reorder-btns"><button id="reorderUp" onclick="reorderMove(-1)">↑ 上へ</button><button id="reorderDown" onclick="reorderMove(1)">↓ 下へ</button></div><button class="cancel" onclick="closeReorder()">完了</button></div></div>
<div id="weightOverlay" class="overlay"><div class="panel"><h3>重みを変更</h3><div id="weightButtons"></div><button class="cancel" onclick="closeWeightPanel()">キャンセル</button></div></div>
<div id="variationOverlay" class="overlay"><div class="panel"><h3 id="variationTitle">詳細を選択</h3><div class="list" id="variationList"></div><button class="cancel" onclick="closeVariationPanel()">キャンセル</button></div></div>
<div id="conflictOverlay" class="overlay"><div class="panel"><h3 id="conflictMsg"></h3><div class="row"><button class="yes" onclick="confirmConflictAdd()">はい</button><button class="no" onclick="closeConflict()">いいえ</button></div></div></div>
<div id="descOverlay" class="overlay"><div class="panel"><div class="desc-title" id="descTitle"></div><div class="desc-body" id="descBody"></div><div class="desc-note" id="descNote" style="display:none"></div><button class="cancel" onclick="closeDesc()">閉じる</button></div></div>

<div id="homePage" class="page active">
  <button class="menuButton" onclick="showPage('toolsPage')">便利機能（ランダム・バッチ・履歴）</button>
  <button class="menuButton" onclick="showPage('basePage')">ベース</button>

  <h2 style="margin-top:28px">設定</h2>

</div>

<div id="toolsPage" class="page">
  <button class="backButton" onclick="showPage('homePage')">← ホーム</button>
  <h1>便利機能</h1>

  <div class="tool-section">
    <h3>シーンをランダム生成</h3>
    <p class="tool-hint">完成に近いプロンプト候補を出します。各候補に状況の説明が付きます。</p>

  <div class="tool-section">
    <h3>テンプレート</h3>
    <p class="tool-hint">現在の選択内容を名前付きで保存・呼び出しできます。</p>
    <div class="template-row">
      <input type="text" id="templateName" placeholder="テンプレート名">
      <button onclick="saveTemplate()">保存</button>
    </div>
    <div id="templateList" class="history-list"></div>
  </div>

  <div class="tool-section">
    <h3>コピー履歴</h3>
    <p class="tool-hint">コピーしたプロンプトをここに残します（最大50件）。</p>
    <button class="menuButton" style="margin-bottom:8px" onclick="clearHistory()">履歴を全消去</button>
    <div id="historyList" class="history-list"></div>
  </div>
</div>

function hideCopyMsg(){document.getElementById("copyMsg").classList.remove("show");document.getElementById("copyButton").classList.remove("copied")}
function addP(text,label,page,skipConflict){
  if(prompts.some(p=>p.text===text))return;
  if(!skipConflict){
    const conf=findConflictWith(text);
    if(conf){pendingConflict={text,label,page};document.getElementById("conflictMsg").textContent=conf+"と矛盾しています、追加しますか？";document.getElementById("conflictOverlay").classList.add("active");return}
  }
  prompts.push({text,label:label||text,weight:1.0,page:page||null});
  hideCopyMsg();updatePrompt();savePrompts();
}
function findConflictWith(text){
  const tl=text.toLowerCase();
  for(const [a,b] of CONFLICT_PAIRS){
    const al=a.toLowerCase(),bl=b.toLowerCase();
    if(tl.includes(al)){const p=prompts.find(x=>x.text.toLowerCase().includes(bl));if(p)return p.label||p.text}
    if(tl.includes(bl)){const p=prompts.find(x=>x.text.toLowerCase().includes(al));if(p)return p.label||p.text}
  }
  return null;
}
function confirmConflictAdd(){if(pendingConflict){addP(pendingConflict.text,pendingConflict.label,pendingConflict.page,true);pendingConflict=null}closeConflict()}

function formatPrompt(p){return p.weight===1.0?p.text:(p.weight+"::"+p.text+"::")}
function updatePrompt(){
  const el=document.getElementById("prompt"),c=document.getElementById("promptCount"),exp=document.getElementById("promptExpand");
  if(!prompts.length){
    el.innerHTML='<span class="placeholder">ここに選択したプロンプトが表示されます</span>';
    el.classList.remove("expanded");exp.classList.remove("show");promptExpanded=false;
  }else{
    el.innerHTML=prompts.map((p,i)=>{
      const b=p.weight!==1.0?`<span class="weight">${p.weight}</span>`:"";
      return `<span class="prompt-chip" data-index="${i}"><span class="chip-label">${escapeHtml(p.label||p.text)}</span>${b}<span class="remove" data-remove="${i}">×</span></span>`;
    }).join("");
    if(prompts.length>COLLAPSE_THRESHOLD){exp.classList.add("show");if(!promptExpanded)el.classList.remove("expanded");else el.classList.add("expanded");exp.textContent=promptExpanded?"▲ 閉じる":"… タップで展開（"+prompts.length+"個）"}
    else{exp.classList.remove("show");el.classList.add("expanded");promptExpanded=true}
  }
  c.textContent=prompts.length+" 個選択中";
  attachChipEvents();updateSelectedButtons();updateHomeFab();checkCurrentConflicts();
}
function escapeHtml(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}
function attachChipEvents(){
  document.querySelectorAll(".prompt-chip").forEach(chip=>{
    const rm=chip.querySelector(".remove");
    if(rm)rm.addEventListener("click",e=>{e.stopPropagation();removePrompt(+rm.dataset.remove)});
    let timer=null;
    const start=e=>{if(e.target.classList.contains("remove"))return;chip._ts=Date.now();timer=setTimeout(()=>openChipMenu(+chip.dataset.index),CHIP_MS)};
    const end=e=>{clearTimeout(timer);if(e.target.classList.contains("remove"))return;if(Date.now()-(chip._ts||0)<CHIP_MS){const p=prompts[+chip.dataset.index];if(p&&p.page)showPage(p.page)}};
    chip.addEventListener("touchstart",start,{passive:true});
    chip.addEventListener("touchend",end);
    chip.addEventListener("mousedown",start);
    chip.addEventListener("mouseup",end);
  });
}

function copyPrompt(){
  const t=prompts.map(formatPrompt).join(", ");
  if(!t)return;
  const out=t.endsWith(",")?t:t+",";
  const btn=document.getElementById("copyButton"),msg=document.getElementById("copyMsg");
  const done=()=>{
    btn.classList.add("copied");msg.classList.add("show");
    setTimeout(()=>btn.classList.remove("copied"),1200);
    history.unshift({text:out,date:new Date().toLocaleString("ja-JP"),ts:Date.now()});
    if(history.length>50)history=history.slice(0,50);
    saveHistory();renderHistory();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(out).then(done).catch(()=>{fallbackCopy(out);done()});
  }else{fallbackCopy(out);done()}
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);

function updateSelectedButtons(){
  const conflictKeys=new Set();
  const texts=prompts.map(p=>p.text.toLowerCase());
  CONFLICT_PAIRS.forEach(([a,b])=>{
    const hasA=texts.some(t=>t.includes(a.toLowerCase()));
    const hasB=texts.some(t=>t.includes(b.toLowerCase()));
    if(hasA&&!hasB)conflictKeys.add(b.toLowerCase());
    if(hasB&&!hasA)conflictKeys.add(a.toLowerCase());
  });
  document.querySelectorAll("button[onclick*='addP']").forEach(btn=>{
    const m=btn.getAttribute("onclick").match(/addP\('([^']+)'/);
    if(!m)return;
    const text=m[1];
    const exists=prompts.some(p=>p.text===text);
    btn.classList.toggle("selected",exists);
    btn.classList.toggle("conflict-btn",!exists&&[...conflictKeys].some(k=>text.toLowerCase().includes(k)));
  });
}
function checkCurrentConflicts(){
  const warn=document.getElementById("conflictWarning");
  if(!warn)return;
  const conflicts=[];
  const texts=prompts.map(p=>p.text.toLowerCase());
  CONFLICT_PAIRS.forEach(([a,b])=>{
    const hasA=texts.some(t=>t.includes(a.toLowerCase()));
    const hasB=texts.some(t=>t.includes(b.toLowerCase()));
    if(hasA&&hasB)conflicts.push(`「${a}」と「${b}」が同時`);
  });
  if(conflicts.length){warn.innerHTML="<strong>注意：</strong> "+conflicts.slice(0,3).join(" / ");warn.classList.add("show")}
  else{warn.classList.remove("show");warn.innerHTML=""}
}

function generatePackages(mode,count){
  const builders={foreplay:buildForeplayScene,position:buildPositionScene,sex:buildFullSexScene,body:buildBodyScene,full:buildFullRandomScene};
  const fn=builders[mode];if(!fn)return[];
  const out=[],seen=new Set();let guard=0;
  while(out.length<count&&guard<100){
    guard++;
    const pack=fn();
    if(!pack||!pack.tags.length)continue;
    const sig=pack.tags.map(t=>t.prompt).sort().join("|");
    if(seen.has(sig))continue;
    seen.add(sig);
    out.push(pack);
  }
  return out;
}

function copyText(text){
  const out=text.endsWith(",")?text:text+",";
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(out).then(()=>{
      history.unshift({text:out,date:new Date().toLocaleString("ja-JP"),ts:Date.now()});
      if(history.length>50)history=history.slice(0,50);
      saveHistory();renderHistory();
      alert("コピーしました");
    }).catch(()=>{fallbackCopy(out);alert("コピーしました")});
  }else{fallbackCopy(out);alert("コピーしました")}
}

function saveTemplate(){

  if(!name){alert("名前を入力してください");return}
  if(!prompts.length){alert("保存するプロンプトがありません");return}
  const data={name,prompts:JSON.parse(JSON.stringify(prompts)),ts:Date.now()};
  const idx=templates.findIndex(t=>t.name===name);
  if(idx>=0)templates[idx]=data;else templates.unshift(data);
  saveTemplates();renderTemplates();
  document.getElementById("templateName").value="";
  alert("テンプレートを保存しました");
}
function renderTemplates(){
  const list=document.getElementById("templateList");

        <button onclick="deleteTemplate(${i})">削除</button>

}
function loadTemplate(i){

}
function deleteTemplate(i){
  if(!confirm("このテンプレートを削除しますか？"))return;
  templates.splice(i,1);saveTemplates();renderTemplates();
}
