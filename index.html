button{border:none;border-radius:10px;padding:11px 16px;font-size:15px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,background .15s,opacity .15s;color:var(--text)}

.prompt-chip.dragging{opacity:.5}
.prompt-chip.drag-over{outline:2px dashed var(--accent)}
.prompt-chip .weight{font-size:11px;background:var(--accent);color:#fff;border-radius:10px;padding:1px 6px}

body.dark #conflictWarning{background:#5c2b2b;color:#f28b82}
#conflictWarning.active{display:block}
.prompt-actions{display:flex;gap:8px;margin-top:12px;align-items:center}
#copyButton,#clearButton{flex:1;padding:13px;font-size:15px;font-weight:600}
#copyButton{background:var(--accent);color:#fff}
#clearButton{background:var(--card);color:var(--danger);border:1px solid #fad2cf}
body.dark #clearButton{border-color:#5c2b2b}
#themeButton{background:var(--card);color:var(--text);padding:10px 12px;font-size:16px;flex:0 0 auto;min-width:44px}
.backButton{margin-bottom:16px;background:var(--card);padding:10px 16px;font-size:14px}
.page{display:none}
.page.active{display:block}
.count{font-size:13px;color:var(--muted);margin-top:6px;text-align:right}
#weightOverlay,#variationOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center;padding:16px}
#weightOverlay.active,#variationOverlay.active{display:flex}
#weightPanel,#variationPanel{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto;text-align:center;color:var(--text)}

#searchResults button{width:100%;text-align:left;padding:12px 14px;font-size:14px}
#searchResults .empty{color:var(--muted);font-size:13px;padding:8px}

function buildSearchIndex(){
