<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovelAI Prompt Tool</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 18px;
      margin-top: 25px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    button:active {
      transform: scale(0.96);
    }

    .menuButton {
      width: 100%;
      margin-bottom: 12px;
      padding: 16px;
      font-size: 17px;
      text-align: left;
    }

    #prompt {
      margin-top: 30px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      min-height: 50px;
      word-break: break-word;
    }

    #copyButton,
    #clearButton {
      margin-top: 15px;
      width: 100%;
    }

    #copyButton {
      background: #222;
      color: white;
    }

    #clearButton {
      background: white;
      color: red;
      border: 1px solid red;
    }

    .backButton {
      margin-bottom: 20px;
      background: white;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }
  </style>
</head>

<body>

  <!-- トップページ -->
  <div id="homePage" class="page active">

    <h1>NovelAI Prompt Tool</h1>

    <button class="menuButton" onclick="showPage('basePage')">
      ベースプロンプト
    </button>

    <button class="menuButton" onclick="showPage('viewPage')">
      視点
    </button>

    <button class="menuButton" onclick="showPage('subjectViewPage')">
      視点（被写体側）
    </button>

    <button class="menuButton" onclick="showPage('expressionPage')">
      表情
    </button>

    <button class="menuButton" onclick="showPage('clothingPage')">
      服装
    </button>

    <button class="menuButton" onclick="showPage('posePage')">
      体位
    </button>

  </div>


  <!-- ベースプロンプト -->
  <div id="basePage" class="page">

    <button class="backButton" onclick="showPage('homePage')">
      ← 戻る
    </button>

    <h1>ベースプロンプト</h1>

    <div class="buttons">
      <button onclick="addPrompt('anime screencap')">
        anime screencap
      </button>

      <button onclick="addPrompt('2d')">
        2d
      </button>

      <button onclick="addPrompt('clean lineart')">
        clean lineart
      </button>

      <button onclick="addPrompt('soft cel shading')">
        soft cel shading
      </button>
    </div>

  </div>


  <!-- 視点 -->
  <div id="viewPage" class="page">

    <button class="backButton" onclick="showPage('homePage')">
      ← 戻る
    </button>

    <h1>視点</h1>

    <div class="buttons">

      <button onclick="addPrompt('pov')">
        主観視点
      </button>

      <button onclick="addPrompt('from above')">
        俯瞰
      </button>

      <button onclick="addPrompt('from below')">
        あおり
      </button>

      <button onclick="addPrompt('front view')">
        正面
      </button>

    </div>

  </div>


  <!-- 視点（被写体側） -->
  <div id="subjectViewPage" class="page">

    <button class="backButton" onclick="showPage('homePage')">
      ← 戻る
    </button>

    <h1>視点（被写体側）</h1>

    <div class="buttons">

      <button onclick="addPrompt('looking at viewer')">
        こちらを見る
      </button>

      <button onclick="addPrompt('looking away')">
        目をそらす
      </button>

    </div>

  </div>


  <!-- 表情 -->
  <div id="expressionPage" class="page">

    <button class="backButton" onclick="showPage('homePage')">
      ← 戻る
    </button>

    <h1>表情</h1>

    <div class="buttons">

      <button onclick="addPrompt('smile')">
        笑顔
      </button>

      <button onclick="addPrompt('angry')">
        怒り
      </button>

      <button onclick="addPrompt('crying')">
        泣き顔
      </button>

      <button onclick="addPrompt('smirk')">
        にやり
      </button>

      <button onclick="addPrompt('wry smile')">
        苦笑い
      </button>

    </div>

  </div>


  <!-- 服装 -->
  <div id="clothingPage" class="page">

    <button class="backButton" onclick="showPage('homePage')">
      ← 戻る
    </button>

    <h1>服装</h1>

    <div class="buttons">

      <button onclick="addPrompt('school uniform')">
        制服
      </button>

      <button onclick="addPrompt('sailor uniform')">
        セーラー服
      </button>

      <button onclick="addPrompt('blazer')">
        ブレザー
      </button>

      <button onclick="addPrompt('gym uniform')">
        体操服
      </button>

    </div>

  </div>


  <!-- 体位 -->
  <div id="posePage" class="page">

    <button class="backButton" onclick="showPage('homePage')">
      ← 戻る
    </button>

    <h1>体位</h1>

    <div class="buttons">

      <button onclick="addPrompt('standing')">
        立つ
      </button>

      <button onclick="addPrompt('sitting')">
        座る
      </button>

      <button onclick="addPrompt('lying')">
        横になる
      </button>

    </div>

  </div>


  <!-- 共通プロンプト欄 -->

  <div id="prompt">
    ここに選択したプロンプトが表示されます
  </div>

  <button id="copyButton" onclick="copyPrompt()">
    プロンプトをコピー
  </button>

  <button id="clearButton" onclick="clearPrompt()">
    プロンプトを消去
  </button>


  <script>

    let prompts = [];

    function addPrompt(prompt) {
      prompts.push(prompt);
      updatePrompt();
    }

    function updatePrompt() {
      const promptElement = document.getElementById("prompt");

      if (prompts.length === 0) {
        promptElement.textContent =
          "ここに選択したプロンプトが表示されます";
      } else {
        promptElement.textContent =
          prompts.join(", ");
      }
    }

    function copyPrompt() {
      const text = prompts.join(", ");

      navigator.clipboard.writeText(text);

      alert("コピーしました！");
    }

    function clearPrompt() {
      prompts = [];
      updatePrompt();
    }

    function showPage(pageId) {

      const pages = document.querySelectorAll(".page");

      pages.forEach(function(page) {
        page.classList.remove("active");
      });

      document.getElementById(pageId).classList.add("active");

      window.scrollTo(0, 0);
    }

  </script>

</body>
</html>
